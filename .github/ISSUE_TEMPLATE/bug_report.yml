name: Bug Report
description: Report a crash or something that is not working correctly
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please search [existing issues](https://github.com/azoklesoftware/azokle-gallery-android/issues) before submitting to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open the app
        2. Go to Library tab
        3. Tap on '...'
        4. See error / crash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Found in Library → About section
      placeholder: "e.g. 1.0"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      placeholder: "e.g. Android 14 (API 34)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. Pixel 7, Samsung Galaxy S23"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logcat / Stack Trace
      description: Paste any relevant crash logs here (use `adb logcat` or Android Studio Logcat).
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant info (screenshots, screen recordings, etc.)
